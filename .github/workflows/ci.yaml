name: MyStoreAPI CI/CD

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate Code (Dev)
    runs-on: ubuntu-latest
    environment: development

    env:
      JWT_ValidIssuer: ${{ secrets.JWT_ValidIssuer }}
      JWT_ValidAudience: ${{ secrets.JWT_ValidAudience }}
      JWT_Secret: ${{ secrets.JWT_Secret }}
      JWT_TokenExpiryTimeInHour: ${{ secrets.JWT_TokenExpiryTimeInHour }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MyStoreAPI.csproj

      - name: Build
        run: dotnet build MyStoreAPI.csproj --no-restore --configuration Release

      # Optional: Add test step if you add tests later
      # - name: Run Tests
      #   run: dotnet test --no-build --verbosity normal

  docker-publish:
    name: Build & Push Docker Image (Prod)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/mystoreapi:latest .

      - name: Login to DockerHub
        run: echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/mystoreapi:latest
